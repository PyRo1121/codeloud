name: CodeLoud family web CI

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

permissions:
  contents: read

concurrency:
  group: codeloud-family-web-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 22.22.2

jobs:
  web:
    name: Lint, typecheck, test, and build Web
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - name: Check out family repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Set up pinned npm
        run: |
          npm_prefix="$RUNNER_TEMP/npm-12.0.2"
          npm install --global --prefix "$npm_prefix" npm@12.0.2 --ignore-scripts
          test "$("$npm_prefix/bin/npm" --version)" = "12.0.2"
          echo "$npm_prefix/bin" >> "$GITHUB_PATH"

      - name: Install locked dependencies
        run: npm ci

      - name: Audit dependency tree
        run: npm audit --audit-level=high

      - name: Verify Web
        run: npm run verify:web
